version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fl_benchmark
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fl_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: 
      context: ./backend
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fl_benchmark
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SHARED_RUN_DIR=/tmp/fl_benchmark_runs
    volumes:
      - ./backend:/app
      - /tmp/fl_benchmark_runs:/tmp/fl_benchmark_runs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # Also doubles as the signal that this container's entrypoint has
      # already run scripts/migrate.py -- celery_worker waits on this being
      # healthy before running its own entrypoint, so the two containers
      # never race each other applying the same Alembic migration.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  celery_worker:
    build: 
      context: ./backend
    command: celery -A services.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fl_benchmark
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SHARED_RUN_DIR=/tmp/fl_benchmark_runs
    volumes:
      - ./backend:/app
      - /tmp/fl_benchmark_runs:/tmp/fl_benchmark_runs
      # Mount the Docker socket so Celery can spawn FL framework containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  pgdata: