name: Publish leaderboard

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "scripts/generate_leaderboard.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate docs/index.html from results/
        run: python scripts/generate_leaderboard.py --repo "${{ github.repository }}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: regenerate leaderboard"
          git push
